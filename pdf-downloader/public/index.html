<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Téléchargeur PDF — Scribd / Calameo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Téléchargeur PDF</h1>
    <p class="subtitle">Scribd &amp; Calameo — uniquement pour les documents dont le bouton
      « Télécharger » est activé par leur propriétaire.</p>

    <form id="download-form">
      <label for="url">Lien du document</label>
      <input
        type="url"
        id="url"
        name="url"
        placeholder="https://www.scribd.com/document/... ou https://www.calameo.com/read/..."
        required
      />

      <details id="scribd-auth">
        <summary>Se connecter à Scribd (optionnel, pour vos propres documents)</summary>
        <label for="email">E-mail Scribd</label>
        <input type="email" id="email" name="email" autocomplete="username" />
        <label for="password">Mot de passe Scribd</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />
        <p class="hint">Vos identifiants ne sont utilisés que pour cette requête et ne sont
          jamais enregistrés.</p>
      </details>

      <button type="submit" id="submit-btn">Récupérer le PDF</button>
    </form>

    <div id="status" class="status" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
