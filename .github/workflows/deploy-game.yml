name: Déploiement FC Clash Mobile (GitHub Pages)

on:
  push:
    branches:
      - claude/fc-mobile-iphone-13-game-lfvgcw
      - main
    paths:
      - "game/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build
        working-directory: game
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: game/dist
