services:
  app:
    build: .
    image: cabinet-medical-app:latest
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/app/data/data.sqlite
      - JWT_SECRET=change-me-in-production
    volumes:
      - cabinet-data:/app/data
    restart: unless-stopped

volumes:
  cabinet-data:
